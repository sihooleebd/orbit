[package]
name = "orbit"
version = "0.2.0"
edition = "2024"
description = "A beautiful terminal music player for your local library"
authors = ["Benjamin Lee"]
license = "MIT"
repository = "https://github.com/sihooleebd/orbit"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
encoding_rs = "0.8.42"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
libc = "0.2"
lofty = "0.25.4"
nucleo-matcher = "0.3.1"
rand = "0.10.3"
ratatui = "0.30.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.3.18"
souvlaki = "0.8.3"
toml = "1.1.6"
unicode-normalization = "0.1.25"
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"

# Dependencies are optimized even in debug builds: audio decoding and FFT need it to keep up in real time.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
